name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tag -> Version: nur den bekannten Prefix strippen, den REST behalten.
    #   "companion-v1.16.0-DL9SAU" -> "v1.16.0-DL9SAU"
    #   "room-server-v1.2.3"       -> "v1.2.3"
    # DL9SAU 2026-07-22: frueher '${GIT_TAG_NAME##*-}' (alles nach dem LETZTEN
    # '-') -- brach bei mehrteiligen Versionen (…-DL9SAU -> nur "DL9SAU") und
    # bei "room-server-" (Dash im Prefix -> "server-..."). Jetzt Prefix-exakt.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # triggered by a tag push (e.g: refs/tags/companion-v1.2.3-DL9SAU)
          # DL9SAU: nur den bekannten Prefix strippen, REST behalten (mehrteilige
          # Versionen wie …-DL9SAU bleiben ganz). NICHT ${##*-} (brach bei -DL9SAU).
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="$GIT_TAG_NAME"
          VERSION_STRING="${VERSION_STRING#companion-}"
          VERSION_STRING="${VERSION_STRING#repeater-}"
          VERSION_STRING="${VERSION_STRING#room-server-}"
        else
          # triggered by a workflow dispatch (e.g: refs/heads/main)
          # strip "refs/heads/" prefix and replace any remaining "/" with "-" to protect file paths
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
