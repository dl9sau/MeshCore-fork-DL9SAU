name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tag -> Version: nur den bekannten Prefix strippen, den REST behalten.
    #   "companion-v1.16.0-DL9SAU" -> "v1.16.0-DL9SAU"
    #   "room-server-v1.2.3"       -> "v1.2.3"
    # DL9SAU 2026-07-22: frueher '${GIT_TAG_NAME##*-}' (alles nach dem LETZTEN
    # '-') -- brach bei mehrteiligen Versionen (…-DL9SAU -> nur "DL9SAU") und
    # bei "room-server-" (Dash im Prefix -> "server-..."). Jetzt Prefix-exakt.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
        GIT_TAG_VERSION="$GIT_TAG_NAME"
        GIT_TAG_VERSION="${GIT_TAG_VERSION#companion-}"
        GIT_TAG_VERSION="${GIT_TAG_VERSION#repeater-}"
        GIT_TAG_VERSION="${GIT_TAG_VERSION#room-server-}"
        echo "GIT_TAG_VERSION=${GIT_TAG_VERSION}" >> $GITHUB_ENV
